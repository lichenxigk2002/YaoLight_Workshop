name: Build and Deploy Test

on:
  push:
    branches: [test]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  TEST_BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/yaolight-backend:test-latest
  TEST_FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/yaolight-frontend:test-latest

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend test image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.TEST_BACKEND_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ env.TEST_FRONTEND_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-test:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/test'
    steps:
      - name: Deploy test environment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_DEPLOY_HOST }}
          username: ${{ secrets.TEST_DEPLOY_USER }}
          key: ${{ secrets.TEST_DEPLOY_SSH_KEY }}
          port: ${{ secrets.TEST_DEPLOY_PORT || '22' }}
          envs: TEST_DEPLOY_WORKDIR
          command_timeout: 10m
          script: |
            set -e
            cd "$TEST_DEPLOY_WORKDIR"
            echo "${{ secrets.TEST_GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker compose -f docker-compose.test.yml pull backend frontend
            docker compose -f docker-compose.test.yml run --rm backend migrate
            docker compose -f docker-compose.test.yml up -d backend frontend
            docker image prune -f
        env:
          TEST_DEPLOY_WORKDIR: ${{ secrets.TEST_DEPLOY_WORKDIR || '/yaolight' }}
