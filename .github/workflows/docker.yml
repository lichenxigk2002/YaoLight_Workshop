# 前后端在同一仓库：Push 时自动构建 Docker 镜像并推送到 GitHub Container Registry (ghcr.io)
# 服务器上拉取镜像后用 docker-compose.prod.yml 运行即可

name: Build and Push Docker Images

on:
  push:
    branches: [deploy]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/yaolight-backend
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/deploy' }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./Low_code_Backend
          file: ./Low_code_Backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/yaolight-frontend
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/deploy' }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Low_code_Frontend
          file: ./Low_code_Frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # deploy 分支构建成功后，在 self-hosted runner（你的服务器）上拉取镜像并重启
  deploy:
    runs-on: self-hosted
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/deploy'
    steps:
      - name: Pull and restart on server
        run: |
          cd /root/yaolight
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
