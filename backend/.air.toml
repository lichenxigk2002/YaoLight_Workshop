root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/server ./cmd/server"
bin = "./tmp/server"
include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "json"]
exclude_dir = ["tmp", "uploads", "vendor"]
exclude_regex = ["_test\\.go"]
delay = 500
stop_on_error = true
send_interrupt = true

[log]
time = true

[misc]
clean_on_exit = true
