services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ./backend/.env
    entrypoint:
      - /bin/sh
      - -c
      - |
        export POSTGRES_USER="$$DB_USER"
        export POSTGRES_PASSWORD="$$DB_PASSWORD"
        export POSTGRES_DB="$$DB_NAME"
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$DB_USER -d $$DB_NAME"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["migrate"]
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      SERVER_MODE: release
      UPLOAD_PATH: /app/uploads
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8080
      SERVER_MODE: release
      UPLOAD_PATH: /app/uploads
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
